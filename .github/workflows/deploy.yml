name: CI and deploy

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test certificate downloads
        run: npm run test:certificates

      - name: Test debugger source mapping
        run: npm run test:debugger

      - name: Build
        run: npm run build

      - name: Install test browser
        run: npx playwright-core install --with-deps chromium

      - name: Test real WASM debugger and certificate downloads
        env:
          PLINTH_URL: http://127.0.0.1:5174/
        run: |
          npm run preview -- --host 127.0.0.1 --port 5174 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --silent --fail "$PLINTH_URL" > /dev/null; then break; fi
            sleep 1
          done
          npm run test:debugger:browser
          npm run test:certificates:browser

      - name: Upload failed browser checks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: /tmp/plinth-*-browser-*
          if-no-files-found: ignore

      - name: Validate Cloudflare deployment
        run: npx wrangler deploy --dry-run

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://plinth.isotopy.xyz

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
